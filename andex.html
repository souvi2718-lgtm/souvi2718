<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حساب التجارة</title>

<style>
body{
    font-family: Arial;
    direction: rtl;
    text-align: center;
    background: #f2f2f2;
}
.container{
    background: white;
    padding: 20px;
    margin: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px #ccc;
}
input{
    padding: 10px;
    margin: 5px;
    width: 80%;
}
button{
    padding: 10px 20px;
    background: green;
    color: white;
    border: none;
    border-radius: 5px;
}
table{
    width: 100%;
    margin-top: 15px;
    border-collapse: collapse;
}
th, td{
    border: 1px solid #ccc;
    padding: 8px;
}
.total{
    font-size: 20px;
    margin-top: 15px;
    color: red;
}
</style>
</head>

<body>

<div class="container">
<h2>تطبيق حساب التجارة</h2>

<input type="text" id="name" placeholder="اسم المنتج"><br>
<input type="number" id="price" placeholder="سعر الفرد"><br>
<input type="number" id="quantity" placeholder="الكمية"><br>

<button onclick="addItem()">إضافة</button>

<table>
<thead>
<tr>
<th>المنتج</th>
<th>سعر الفرد</th>
<th>الكمية</th>
<th>الثمن الإجمالي</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<div class="total">
المجموع النهائي: <span id="finalTotal">0</span>
</div>

</div>

<script>
let finalTotal = 0;

function addItem(){
    let name = document.getElementById("name").value;
    let price = parseFloat(document.getElementById("price").value);
    let quantity = parseFloat(document.getElementById("quantity").value);

    if(name == "" || isNaN(price) || isNaN(quantity)){
        alert("يرجى ملء جميع الخانات");
        return;
    }

    let total = price * quantity;
    finalTotal += total;

    let table = document.getElementById("tableBody");
    let row = table.insertRow();

    row.insertCell(0).innerHTML = name;
    row.insertCell(1).innerHTML = price;
    row.insertCell(2).innerHTML = quantity;
    row.insertCell(3).innerHTML = total;

    document.getElementById("finalTotal").innerHTML = finalTotal;

    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("quantity").value = "";
}
</script>

</body>
</html>
