```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لائحة متابعة الطلاب</title>

<style>
body{
    font-family:Tahoma,Arial,sans-serif;
    background:#f4f4f4;
    margin:15px;
}
h2{
    text-align:center;
    color:#0d47a1;
}
button{
    padding:10px 15px;
    margin:5px;
    border:none;
    background:#1976d2;
    color:white;
    border-radius:5px;
    cursor:pointer;
}
button:hover{
    background:#125ea7;
}
table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
}
th,td{
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
}
th{
    background:#1976d2;
    color:#fff;
}
input{
    width:95%;
    padding:5px;
    text-align:center;
    box-sizing:border-box;
}
#total{
    margin-top:15px;
    font-size:20px;
    font-weight:bold;
    color:green;
}
</style>
</head>

<body>

<h2>لائحة متابعة الطلاب</h2>

<button onclick="addRow()">إضافة طالب</button>

<table>
<thead>
<tr>
<th>م</th>
<th>اسم الطالب</th>
<th>الأيام</th>
<th>عدد الأحزاب</th>
<th>أبيات الأخضري</th>
<th>أبيات عبيد ربه</th>
<th>الأحاديث</th>
<th>الأذكار</th>
</tr>
</thead>

<tbody id="tableBody">
</tbody>

</table>

<div id="total">مجموع عدد الأحزاب: 0</div>

<script>

function addRow() {

    const tbody = document.getElementById("tableBody");
    const num = tbody.rows.length + 1;

    const row = document.createElement("tr");

    row.innerHTML = `
        <td>${num}</td>
        <td><input type="text" placeholder="اسم الطالب"></td>
        <td><input type="number" min="0"></td>
        <td>
            <input type="number"
                   min="0"
                   value="0"
                   class="ahzab"
                   oninput="calculateTotal()">
        </td>
        <td><input type="number" min="0"></td>
        <td><input type="number" min="0"></td>
        <td><input type="number" min="0"></td>
        <td><input type="number" min="0"></td>
    `;

    tbody.appendChild(row);
}

function calculateTotal() {

    let total = 0;

    document.querySelectorAll(".ahzab").forEach(function(item) {
        total += parseInt(item.value) || 0;
    });

    document.getElementById("total").innerText =
        "مجموع عدد الأحزاب: " + total;
}

addRow();

</script>

</body>
</html>
```
